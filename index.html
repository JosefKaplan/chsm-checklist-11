<style>
:root {
  /* Black Legion: warm bone and ink neutrals; gold marks your turn, crimson marks the opponent's (and errors), blue is CP.
     Layout: sticky tracker (round / turn / CP / phase) on top, one column of checklists, tab bar at the bottom. */
  --bg: #eeeae4;
  --surface: #ffffff;
  --surface-2: #f6f3ee;
  --ink: #1c1917;
  --muted: #655d57;
  --line: #d9d2c9;
  --mine: #86660a;
  --mine-soft: #f1e6c4;
  --opp: #ae2b26;
  --opp-soft: #f7dedb;
  --on-turn: #ffffff;
  --cp: #1d6597;
  --cp-soft: #dae9f5;
  --warn: #9a5600;
  --warn-soft: #fbecd6;
  --s1: #0f766e;
  --s2: #7a4cc0;
  --s3: #b23f7e;
  --s4: #5d6b78;
  --font-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #100e0d;
    --surface: #1a1716;
    --surface-2: #232019;
    --ink: #ece6e0;
    --muted: #a79d94;
    --line: #36302c;
    --mine: #e2b64f;
    --mine-soft: #3a2f14;
    --opp: #f27a6e;
    --opp-soft: #40201d;
    --on-turn: #15110a;
    --cp: #6db4ea;
    --cp-soft: #15293a;
    --warn: #f1b45c;
    --warn-soft: #3a2b14;
    --s1: #4fc4b8;
    --s2: #b597ec;
    --s3: #ec8ec0;
  --s4: #9db0c0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #100e0d;
  --surface: #1a1716;
  --surface-2: #232019;
  --ink: #ece6e0;
  --muted: #a79d94;
  --line: #36302c;
  --mine: #e2b64f;
  --mine-soft: #3a2f14;
  --opp: #f27a6e;
  --opp-soft: #40201d;
  --on-turn: #15110a;
  --cp: #6db4ea;
  --cp-soft: #15293a;
  --warn: #f1b45c;
  --warn-soft: #3a2b14;
  --s1: #4fc4b8;
  --s2: #b597ec;
  --s3: #ec8ec0;
  --s4: #9db0c0;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
  --turn: var(--mine);
  --turn-soft: var(--mine-soft);
}
body[data-turn="opp"] { --turn: var(--opp); --turn-soft: var(--opp-soft); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--turn); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
p { margin: 0; }

/* ---------- Tracker ---------- */
.tracker {
  position: sticky; top: 0; z-index: 10;
  background: var(--surface);
  border-top: 4px solid var(--turn);
  border-bottom: 1px solid var(--line);
  padding: 8px 16px 10px;
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px;
}
.tr-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.det-chip {
  border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px;
  padding: 4px 10px; font-size: 13px; font-weight: 500; max-width: 48%; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tr-controls { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper .lbl { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-right: 2px; }
.stepper button {
  width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface-2); font-size: 18px; line-height: 1; display: grid; place-items: center;
}
.stepper .num { font-family: var(--font-display); font-weight: 700; font-size: 22px; min-width: 1.4ch; text-align: center; font-variant-numeric: tabular-nums; }
.stepper .of { font-size: 13px; color: var(--muted); margin-left: -3px; margin-right: 2px; }
.stepper.cp .num { color: var(--cp); }
.stepper.cp { background: var(--cp-soft); border-radius: 10px; padding: 2px 4px 2px 8px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface-2); }

}

/* stratagem overview grid */

.setting .sm { font-size: 12px; color: var(--muted); }

.ab { font-size: .86em; font-weight: 600; white-space: nowrap; }

.rules-note { font-size: 13px; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; }

/* always on */

/* log */

.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font-size: 13px; }
.log li { display: grid; grid-template-columns: 9.5em 1fr; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--line); }
.log .at { color: var(--muted); font-variant-numeric: tabular-nums; }

/* army */
.opts { display: grid; gap: 6px; }
.opt {
  display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: start;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; cursor: pointer;
}

.custom-form input[type="text"], .custom-form select {
  width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); padding: 8px 10px; min-height: 38px;
}
.f-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.f-row > div { display: grid; gap: 4px; }
.chk { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.chk input { width: 18px; height: 18px; accent-color: var(--mine); }
.primary { border: 0; border-radius: 8px; padding: 9px 14px; background: var(--mine); color: var(--on-turn); font-weight: 600; justify-self: start; }
.custom-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.custom-list li { display: flex; justify-content: space-between; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 12px; }

/* tab bar */
.tabbar {

.toast {
  position: fixed; left: 50%; bottom: calc(70px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: var(--ink); color: var(--surface); padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 500;

@media (max-width: 380px) {
  .seg button { padding: 7px 8px; font-size: 13px; }
  .f-row { grid-template-columns: 1fr; }

<script>
/* =====================================================================
   DATA — summaries paraphrased from Wahapedia (Chaos Space Marines, 11th ed.,
   App v1.2, rules data export of 12 Nov 2026) and the 11th-edition core rules.
   slot = "turn:phase"  turn: mine | opp | any   phase: command | movement |
   shooting | charge | fight | end | any       w = start | during | react | end
   ===================================================================== */
const WAHA = "https://wahapedia.ru/wh40k11ed/factions/chaos-space-marines";

const PHASES = [
  { id: "command", label: "Command" },
  { id: "movement", label: "Movement" },
  { id: "shooting", label: "Shooting" },
  { id: "charge", label: "Charge" },
  { id: "fight", label: "Fight" },
  { id: "end", label: "End of turn" }
];
const WIN = {
  start: { o: 0, label: "Start of phase" },
  during: { o: 1, label: "During the phase" },
  react: { o: 2, label: "In reaction" },
  end: { o: 3, label: "End of phase" }
};

/* Dark Pacts happen each time a unit is selected to shoot or fight; many detachment and unit effects hang off them. */
const PACT = ["mine:shooting", "any:fight"];

const S = (id, name, cp, type, slots, w, when, target, effect, x) =>
  Object.assign({ id, name, cp, type, slots, w, when, target, effect }, x || {});

/* The ten core stratagems (core rules 15.02-15.12). Explosives and Smokescreen need a keyword, but 35 Chaos Space
   Marines datasheets have GRENADES and 6 have SMOKE, so they stay in the lists with a "Needs" note. */
const CORE = [
  S("core-reroll", "Command Re-roll", 1, "Core", ["any:any"], "react",
    'Any phase, just after you roll for an Advance, Charge, Damage, Hazard, Hit, Save or Wound roll, or for the number of attacks.',
    'The unit or model that rolled.',
    'Re-roll that roll. If several dice were rolled together, re-roll one of them (Charge rolls are re-rolled in full).'),
  S("core-bravery", "Insane Bravery", 1, "Core", ["mine:command"], "during",
    'Battle-shock step of your Command phase, just before you make a battle-shock roll for one of your units.',
    'That unit.',
    'The roll is passed automatically.', { limit: "battle" }),
  S("core-overwatch", "Fire Overwatch", 1, "Core", ["opp:movement"], "end",
    'End of your opponent’s Movement phase.',
    'One of your unengaged units (not TITANIC).',
    'Your unit shoots using snap shooting: one visible enemy unit within 24", hits only on unmodified 6s (never Critical Hits), no Hit re-rolls.'),
  S("core-ingress", "Rapid Ingress", 1, "Core", ["opp:movement"], "end",
    'End of your opponent’s Movement phase.',
    'One of your units in Strategic Reserves (not AIRCRAFT).',
    'Your unit makes an ingress move and arrives on the battlefield.',
    { restr: 'Not in the first battle round.' }),
  S("core-heroic", "Heroic Intervention", 1, "Core", ["opp:charge"], "end",
    'End of your opponent’s Charge phase.',
    'One of your unengaged units within 12" of an enemy unit (a VEHICLE only if it is a CHARACTER or WALKER).',
    'Resolve a charge with it. Pick a mode before the charge roll. Leap to Defend: you can only target enemy units that made a charge move this phase. Into the Fray (+1CP): a charge roll above 6 counts as 6, and you can target any enemy units within 6".',
    { restr: 'Into the Fray costs 1CP more (2CP in total).' }),
  S("core-challenge", "Epic Challenge", 1, "Core", ["any:fight"], "react",
    'Fight phase, just after one of your CHARACTER units is selected to fight.',
    'That CHARACTER unit.',
    'Pick one CHARACTER model in it: its melee weapons gain [PRECISION] until the end of the phase.'),
  S("core-counter", "Counteroffensive", 2, "Core", ["opp:fight"], "react",
    'Fight step of your opponent’s Fight phase, just after an enemy unit has resolved its attacks.',
    'One of your units that is eligible to fight.',
    'Until the end of the phase your unit has Fights First, and it must be the next unit you select to fight.'),
  S("core-crush", "Crushing Impact", 1, "Core", ["mine:charge"], "react",
    'Your Charge phase, just after one of your MONSTER or VEHICLE units ends a charge move.',
    'That unit.',
    'Pick an enemy unit it is engaged with and one of your models engaged with it. Roll D6 equal to that model’s Toughness: each 5+ deals 1 mortal wound to the enemy (max 6), each 1 deals 1 mortal wound to your unit.'),
  S("core-explosives", "Explosives", 1, "Core", ["mine:shooting"], "during",
    'Your Shooting phase.',
    'One of your unengaged EXPLOSIVES or GRENADES units that is eligible to shoot and didn’t Advance this turn.',
    'Pick one EXPLOSIVES/GRENADES model in it and one unengaged enemy unit within 8" that it can see. Roll six D6: each 4+ deals 1 mortal wound to that enemy unit.',
    { needs: 'EXPLOSIVES or GRENADES' }),
  S("core-smoke", "Smokescreen", 1, "Core", ["opp:shooting"], "start",
    'Start of your opponent’s Shooting phase.',
    'One of your SMOKE units.',
    'Until the end of the phase, attacks against your SMOKE unit, or against a unit the attacker can’t fully see because of your SMOKE models, are against a target with the Benefit of Cover.',
    { needs: 'SMOKE' })
];

const D = (id, name, rule, ruleReminders, enh, strats) => ({ id, name, rule, ruleReminders, enh, strats });
const R = (id, name, slots, w, text, x) => Object.assign({ id, name, slots, w, text }, x || {});
const E = (id, name, who, text, x) => Object.assign({ id, name, who, text }, x || {});
/* short: the label used in the checklist when the full name is long. */
const U = (id, name, abilities, short) => ({ id, name, abilities, short: short || name });

/* Army rules. Dark Pacts is gone while a selected detachment removes it (Renegade Warband): see darkPactsLost(). */
const ARMY_RULES = [
  R("army-dp", "Dark Pacts", PACT, "during",
    'Each unit you select to shoot or fight can make a Dark Pact: it takes a Leadership test first, and if that fails it suffers D3 mortal wounds. Then pick [LETHAL HITS] or [SUSTAINED HITS 1] for its weapons until the end of the phase. You need an eligible target to select a unit just to make a Dark Pact.',
    { src: "Army rule", pact: true }),
  R("army-dp-ow", "Dark Pacts (Fire Overwatch)", ["opp:movement"], "end",
    'A unit you target with Fire Overwatch is selected to shoot, so it can make a Dark Pact: Leadership test, D3 mortal wounds if it fails, then pick [LETHAL HITS] or [SUSTAINED HITS 1]. Dark Pact effects from detachments and units apply here too.',
    { src: "Army rule", pact: true })
];

/* Core turn steps (own words, from core rules 07-12 and 20). */
const STEPS = [
  R("st-cmd-start", "Start of turn and phase", ["any:command"], "start", 'Resolve rules that trigger at the start of the turn, then those that trigger at the start of the Command phase.'),
  R("st-cmd-cp", "Gain Core CP", ["any:command"], "during", 'Both players gain 1CP. The tracker adds yours when you tap Next, unless you turned that off under Army > Game.'),
  R("st-cmd-shock", "Battle-shock step", ["mine:command"], "during", 'Make a battle-shock roll (2D6, passing on a result equal to or higher than the unit’s Leadership) for each of your units that is Battle-shocked or at or below half-strength. Passing removes Battle-shock. A Battle-shocked unit has OC ‘–’, can’t be targeted by your Stratagems and can’t start Actions.'),
  R("st-cmd-oppshock", "Battle-shock step", ["opp:command"], "during", 'Your opponent makes their battle-shock rolls. Watch for abilities that force extra tests or change the result.'),
  R("st-mov", "Move Units step", ["mine:movement"], "during", 'Select every unit one at a time, including units in Strategic Reserves or embarked (a unit you don’t move stays put). Move types: remain stationary, Normal move (up to M), Advance (M + D6, then it can’t charge and only [ASSAULT] weapons can shoot), Fall Back (engaged units only: Ordered Retreat, or Desperate Escape if Battle-shocked, which means a hazard roll per model and then a battle-shock roll; it can’t shoot or charge afterwards), Disembark.'),
  R("st-mov-res", "Reinforcements", ["mine:movement"], "during", 'From battle round 2, units in Strategic Reserves arrive with an ingress move: wholly within 6" of a battlefield edge and more than 8" horizontally from enemy units, and not in the enemy deployment zone before round 3. Reserves units that still haven’t arrived at the end of round 3 are destroyed.'),
  R("st-mov-opp", "Enemy moves", ["opp:movement"], "react", 'Watch enemy Normal, Advance and Fall Back moves: several reactions trigger just after a move ends.'),

    R("u-warpsmith-mechanisms", "Master of Mechanisms", ["mine:command"], "during", 'Pick a friendly HERETIC ASTARTES VEHICLE model within 3": it regains up to D3 lost wounds and, until your next Command phase, adds 1 to its Hit rolls. Each model can be picked once per Command phase.'),
    R("u-warpsmith-spirits", "Enrage Machine Spirits", ["mine:movement"], "end", 'End of your Movement phase: pick an enemy VEHICLE unit within 12" of this model; it must take a Battle-shock test.')
  ]),
  U("u-chaos-terminators", "Chaos Terminator Squad", [
    R("u-chaos-terminators-despoilers", "Despoilers", PACT, "react", 'Each time this unit makes a Dark Pact, you can re-roll its Hit rolls until the end of the phase.')
  ]),
  U("u-commune", "Dark Commune", [
    R("u-commune-ritual", "Dark Ritual", ["mine:command"], "during", 'Once per battle, if the unit contains a CULT DEMAGOGUE: until the end of the turn it can declare a charge after Advancing and adds 1 to its Hit and Wound rolls.', { limit: "battle" })
  ]),
  U("u-cultmob", "Cultist Mob", [
    R("u-cultmob-gods", "For the Dark Gods", ["mine:command"], "end", 'End of your Command phase: if the unit is within range of an objective marker you control, that objective stays under your control until your opponent’s Level of Control over it is greater than yours at the end of a phase.')
  ]),
  U("u-possessed", "Possessed", [
    R("u-possessed-bloodshed", "Unholy Bloodshed", PACT, "react", 'Once per battle, when the unit makes a Dark Pact, its weapons have [DEVASTATING WOUNDS] until the end of the phase.', { limit: "battle" })
  ])
];

UNITS.sort((a, b) => a.name.localeCompare(b.name));

/* ---------------- lookup tables ---------------- */
const DET = Object.fromEntries(DETACHMENTS.map(d => [d.id, d]));
const ALL_STRATS = {};
CORE.forEach(s => { ALL_STRATS[s.id] = Object.assign(s, { srcName: "Core" }); });
DETACHMENTS.forEach(d => d.strats.forEach(s => { ALL_STRATS[s.id] = Object.assign(s, { srcName: d.name, det: d.id }); }));

/* ===================================================================== */
const KEY = "csm-turn-checklist-v1";
const store = {
  get() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) { /* storage unavailable: keep in memory */ } }
};

const DEFAULT_SETTINGS = { first: "mine", autoCP: true, size: "strike", dp: 3 };

function freshGame(prev) {
  const keep = prev || {};
  return {
    v: 1,
    dets: Array.isArray(keep.dets) ? keep.dets.filter(id => DET[id]) : ["veterans"],
    enh: keep.enh || [],
    units: keep.units || [],
    aug: keep.aug || [],
    custom: keep.custom || [],
    settings: Object.assign({}, DEFAULT_SETTINGS, keep.settings || {}),
    round: 1,
    turn: (keep.settings && keep.settings.first) || "mine",
    phase: "command",
    cp: 1,
    used: {}, done: {}, battle: {}, perTurn: {}, perRound: {},
    log: [{ at: "R1 · " + ((keep.settings && keep.settings.first) === "opp" ? "Opponent's" : "Your") + " Command", text: "Game started · +1CP" }],
    view: keep.view || "game"
  };
}

/* Backfill every field added after the first release so older saves keep working (rule 4 in CLAUDE.md). */
function migrate(st) {
  st.settings = Object.assign({}, DEFAULT_SETTINGS, st.settings || {});
  if (!Array.isArray(st.aug)) st.aug = [];
  return st;
}
let state = store.get();
if (!state || state.v !== 1) state = freshGame();
migrate(state);
const undoStack = [];

/* ---------------- helpers ---------------- */
const other = t => (t === "mine" ? "opp" : "mine");
const phaseKey = () => `${state.round}|${state.turn}|${state.phase}`;
const turnKey = () => `${state.round}|${state.turn}`;
const inList = (map, k, id) => !!(map[k] && map[k].includes(id));
const addTo = (map, k, id) => { (map[k] = map[k] || []).includes(id) || map[k].push(id); };
const removeFrom = (map, k, id) => { if (map[k]) map[k] = map[k].filter(x => x !== id); };
const phaseLabel = id => PHASES.find(p => p.id === id).label;

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
const CAPS = /\b([A-Z][A-Z'’\-]+(?: (?:OF THE |OF )?[A-Z][A-Z'’\-]+)*)\b/g;
function fmt(s) {
  return esc(s).split(/(\[[^\]]+])/g).map((part, i) =>
    i % 2 ? `<span class="ab">${part}</span>`
          : part.replace(CAPS, m => (m.length <= 2 ? m : `<span class="kw">${m}</span>`))
  ).join("");
}

function slotMatches(slot, turn, phase) {
  const [t, p] = slot.split(":");
  if (t !== "any" && t !== turn) return false;
  if (p === "any") return phase !== "end";
  return p === phase;
}
const matches = (it, turn, phase) => Array.isArray(it.slots) && it.slots.some(s => slotMatches(s, turn, phase));
const byWindow = (a, b) => (WIN[a.w].o - WIN[b.w].o) || ((a.type === "Core") - (b.type === "Core")) || ((a.cp || 0) - (b.cp || 0));

const selDets = () => DETACHMENTS.filter(d => state.dets.includes(d.id));
const selUnits = () => UNITS.filter(u => state.units.includes(u.id));
const dpUsed = () => selDets().reduce((n, d) => n + d.dp, 0);
const detLabel = () => { const ds = selDets(); return ds.length ? ds.map(d => d.name).join(" + ") : "No detachment"; };
const currentSize = () => SIZES.find(z => z.id === state.settings.size) || SIZES[1];
const dyn = t => String(t).replace(/\{(dec|wps|cult)}/g, (m, key) => currentSize()[key]);
const darkPactsLost = () => selDets().some(d => d.noDarkPacts);

/* Core rules 25.04: in an Incursion battle a 3 DP detachment can be the only detachment even though the budget is 2 DP. */
const isLoneIncursionDetachment = ds => state.settings.size === "incursion" && ds.length === 1 && ds[0].dp === 3;

/* Problems break a rule of the army you picked; notes only explain an interaction. */
function armyProblems() {
  const ds = selDets(), probs = [];
  const seen = {};
  ds.forEach(d => {
    if (!d.unique) return;
    if (seen[d.unique]) probs.push({ kind: "unique", text: `${seen[d.unique].name} and ${d.name} share the Unique tag ${d.unique}, so they can't be taken together.` });
    else seen[d.unique] = d;
  });
  const used = dpUsed();
  if (used > state.settings.dp && !isLoneIncursionDetachment(ds)) probs.push({ kind: "dp", text: `Your detachments cost ${used} DP but your budget is ${state.settings.dp} DP.` });
  const limit = currentSize().enh;
  if (limit != null && state.enh.length > limit) probs.push({ kind: "enh", text: `You picked ${state.enh.length} enhancements but a ${currentSize().label} battle allows ${limit}.` });
  return probs;
}
function armyNotes() {
  const notes = [], warband = selDets().find(d => d.noDarkPacts);
  if (warband) {
    const reliant = selDets().filter(d => d.needsDarkPacts).map(d => d.name);
    notes.push(`${warband.name} removes Dark Pacts from your HERETIC ASTARTES models, so the Dark Pact reminders are hidden.`
      + (reliant.length ? ` These detachments depend on Dark Pacts: ${reliant.join(", ")}.` : ""));
  }
  return notes;
}
function blockReason(d) {
  if (state.dets.includes(d.id)) return "";
  const clash = d.unique && selDets().find(x => x.unique === d.unique);
  if (clash) return `Shares the Unique tag ${d.unique} with ${clash.name}.`;
  const left = state.settings.dp - dpUsed();
  if (d.dp <= left || (state.settings.size === "incursion" && d.dp === 3 && state.dets.length === 0)) return "";
  return `Costs ${d.dp} DP: you have ${Math.max(0, left)} DP left.` + (state.settings.size === "incursion" && d.dp === 3 ? " In Incursion a 3 DP detachment is only allowed on its own." : "");
}
function stratPool() { return CORE.concat(...selDets().map(d => d.strats)); }

function stratStatus(s) {
  if (inList(state.used, phaseKey(), s.id)) return "Used this phase";
  if (s.limit === "battle" && state.battle[s.id]) return "Used this battle";
  if (s.limit === "turn" && inList(state.perTurn, turnKey(), s.id)) return "Used this turn";
  if (s.limit === "round" && inList(state.perRound, String(state.round), s.id)) return "Used this round";
  return null;
}

function reminderDone(r) {
  if (r.limit === "battle") return !!state.battle[r.id];
  if (r.limit === "round") return inList(state.perRound, String(state.round), r.id);
  if (r.limit === "turn") return inList(state.perTurn, turnKey(), r.id);
  return inList(state.done, phaseKey(), r.id);
}

function timedReminders(turn, phase) {
  const list = [];
  STEPS.forEach(s => matches(s, turn, phase) && list.push(s));
  ARMY_RULES.forEach(r => matches(r, turn, phase) && !(r.pact && darkPactsLost()) && list.push(r));
  selDets().forEach(det => {
    det.ruleReminders.forEach(r => matches(r, turn, phase) && (!r.needsUnit || state.units.includes(r.needsUnit)) && list.push(Object.assign({ src: "Detachment rule" }, r)));
    det.enh.filter(e => state.enh.includes(e.id) && e.slots).forEach(e => matches(e, turn, phase) && list.push(Object.assign({ src: "Enhancement" }, e)));
  });
  selUnits().forEach(u => u.abilities.forEach(a => a.slots && matches(a, turn, phase) && list.push(Object.assign({}, a, { src: `Unit · ${u.short || u.name}`, name: a.name === u.short ? "" : a.name }))));
  state.custom.forEach(c => matches(c, turn, phase) && list.push(Object.assign({ src: "Your reminder" }, c)));
  return list.sort(byWindow);
}

function limitTag(limit) {
  if (!limit) return "";
  const t = { battle: "Once per battle", turn: "Once per turn", round: "Once per round" }[limit];
  return `<span class="tag limit">${t}</span>`;
}
const verifyTag = it => (it.verify ? `<span class="tag warn" title="The timing or wording differs between sources: check Wahapedia">Check wording</span>` : "");

/* ---------------- mutations ---------------- */
function snapshot() {
  const copy = Object.assign({}, state); delete copy.view; delete copy.stratMode;
  undoStack.push(JSON.stringify(copy));
  if (undoStack.length > 50) undoStack.shift();
}
function save() { store.set(state); }
function mutate(fn) { snapshot(); fn(); save(); render(); }
function undo() {
  if (!undoStack.length) { toast("Nothing to undo"); return; }
  const view = state.view, stratMode = state.stratMode;
  state = Object.assign(JSON.parse(undoStack.pop()), { view, stratMode });
  save(); render(); toast("Undone");
}
function addLog(text) {
  const who = state.turn === "mine" ? "Your" : "Opp's";
  state.log.unshift({ at: `R${state.round} · ${who} ${phaseLabel(state.phase)}`, text });
  state.log = state.log.slice(0, 60);
}

function nextInfo() {
  const i = PHASES.findIndex(p => p.id === state.phase);
  if (i < PHASES.length - 1) return { label: PHASES[i + 1].label, done: false };
  const first = state.settings.first;
  if (state.turn === first) return { label: other(first) === "mine" ? "Your turn" : "Opp's turn", done: false };
  if (state.round >= 5) return { label: "Battle over", done: true };
  return { label: `Round ${state.round + 1}`, done: false };
}

function nextPhase() {
  const i = PHASES.findIndex(p => p.id === state.phase);
  if (i < PHASES.length - 1) { state.phase = PHASES[i + 1].id; return; }
  const first = state.settings.first;
  if (state.turn === first) state.turn = other(first);
  else {
    if (state.round >= 5) { toast("Battle round 5 is over: the battle has ended"); return; }
    state.round += 1; state.turn = first;
  }
  state.phase = "command";
  if (state.settings.autoCP) { state.cp += 1; addLog("+1CP (Command phase)"); toast(`+1CP for the Command phase · ${state.cp}CP`); }
  window.scrollTo(0, 0);
}

function useStrat(id) {
  const s = ALL_STRATS[id];
  if (!s || stratStatus(s)) return;
  if (state.cp < s.cp) { toast(`Not enough CP: ${s.name} costs ${s.cp}CP`); return; }
  state.cp -= s.cp;
  addTo(state.used, phaseKey(), id);
  if (s.limit === "battle") state.battle[id] = true;
  if (s.limit === "turn") addTo(state.perTurn, turnKey(), id);
  if (s.limit === "round") addTo(state.perRound, String(state.round), id);
  addLog(`${s.name} (−${s.cp}CP)`);
  toast(`${s.name}: −${s.cp}CP · ${state.cp}CP left`);
}

function toggleReminder(id, limit, on) {
  if (limit === "battle") { if (on) state.battle[id] = true; else delete state.battle[id]; }
  else if (limit === "turn") { on ? addTo(state.perTurn, turnKey(), id) : removeFrom(state.perTurn, turnKey(), id); }
  else if (limit === "round") { on ? addTo(state.perRound, String(state.round), id) : removeFrom(state.perRound, String(state.round), id); }
  else { on ? addTo(state.done, phaseKey(), id) : removeFrom(state.done, phaseKey(), id); }
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}

/* ---------------- rendering ---------------- */
function renderTracker() {
  const n = nextInfo();
  return `
  <div class="tr-top">
    <div class="seg" role="group" aria-label="Whose turn">
      <button data-act="turn" data-turn="mine" aria-pressed="${state.turn === "mine"}">My turn</button>
      <button data-act="turn" data-turn="opp" aria-pressed="${state.turn === "opp"}">Opponent</button>
    </div>
    <button class="det-chip" data-act="view" data-view="army" title="Change detachments">${dpUsed()}/${state.settings.dp} DP · ${esc(detLabel())}</button>
  </div>
  <div class="tr-controls">
    <div class="stepper" role="group" aria-label="Battle round">
      <span class="lbl">Round</span>
      <button data-act="round" data-d="-1" aria-label="Previous battle round">−</button>
      <output class="num" aria-live="polite">${state.round}</output><span class="of">/5</span>
      <button data-act="round" data-d="1" aria-label="Next battle round">+</button>
    </div>
    <div class="stepper cp" role="group" aria-label="Command points">
      <span class="lbl">CP</span>
      <button data-act="cp" data-d="-1" aria-label="Remove 1 CP">−</button>
      <output class="num" aria-live="polite">${state.cp}</output>
      <button data-act="cp" data-d="1" aria-label="Add 1 CP">+</button>
    </div>
  </div>
  <div class="tr-phases">
    <div class="phase-list" role="group" aria-label="Phase">
      ${PHASES.map(p => `<button data-act="phase" data-phase="${p.id}" ${p.id === state.phase ? 'aria-current="step"' : ""}>${p.label}</button>`).join("")}
    </div>
    <button class="next" data-act="next" ${n.done ? "disabled" : ""} aria-label="Go to ${esc(n.label)}">${esc(n.label)} ›</button>
  </div>`;
}

function srcClass(s) {
  if (s.type === "Core") return "src-core";
  const i = selDets().findIndex(d => d.id === s.det);
  return i >= 0 ? `src-${i + 1}` : "";
}
let sheetId = null;

function slotChip(sl) {
  const [t, p] = sl.split(":");
  if (p === "any") return t === "any" ? "Any phase" : (t === "mine" ? "Any phase of your turn" : "Any phase of opponent's turn");
  const who = { mine: "Your", opp: "Opponent's", any: "Either player's" }[t];
  return p === "end" ? `End of ${t === "mine" ? "your" : t === "opp" ? "opponent's" : "either"} turn` : `${who} ${phaseLabel(p)}`;
}

function stratCard(s, opts) {
  const status = opts.interactive ? stratStatus(s) : null;
  const short = opts.interactive && !status && state.cp < s.cp;
  const btn = !opts.interactive ? "" :
    status ? `<button class="use" disabled>${status}</button>` :
    short ? `<button class="use" disabled>Need ${s.cp}CP</button>` :
    `<button class="use" data-act="use" data-id="${s.id}">Use · ${s.cp}CP</button>`;
  const isCore = s.type === "Core";
  const typeLine = isCore ? "Core stratagem · every army" : `${s.type === "Detachment" ? "Detachment stratagem" : s.type} · ${esc(s.srcName)}`;
  const link = isCore ? "<span></span>" : `<a href="${WAHA}#${DET[s.det].anchor}" target="_blank" rel="noopener">Full text on Wahapedia ↗</a>`;
  return `
  <article class="strat ${isCore ? "core" : srcClass(s)} ${status ? "is-used" : ""}">
    <header><span class="cpb">${s.cp}CP</span><h3>${esc(s.name)}</h3>${isCore ? `<span class="tag core">Core</span>` : ""}${limitTag(s.limit)}${verifyTag(s)}</header>
    <p class="meta">${typeLine}</p>
    ${opts.showSlots ? `<p class="slots">${s.slots.map(sl => `<span class="tag">${esc(slotChip(sl))}</span>`).join("")}</p>` : ""}
    <p class="when"><b>When</b>${fmt(s.when)}</p>
    <p><b>Target</b>${fmt(s.target)}</p>
    <p><b>Effect</b>${fmt(s.effect)}</p>
    ${s.restr ? `<p><b>Restriction</b>${fmt(s.restr)}</p>` : ""}
    ${s.needs ? `<p class="kwnote"><b>Needs</b>a unit with the ${fmt(s.needs)} keyword.</p>` : ""}
    <footer>${link}${btn}</footer>
  </article>`;
}

function groupedCards(list, opts) {
  const groups = {};
  list.forEach(s => (groups[s.w] = groups[s.w] || []).push(s));
  return Object.keys(WIN).filter(w => groups[w]).map(w => `
    <h3 class="win">${state.phase === "end" && opts.interactive ? "End of turn" : WIN[w].label}</h3>
    <div class="cards">${groups[w].sort(byWindow).map(s => stratCard(s, opts)).join("")}</div>`).join("");
}

function renderGame() {
  const dets = selDets();
  const reminders = timedReminders(state.turn, state.phase);
  const strats = stratPool().filter(s => matches(s, state.turn, state.phase)).sort(byWindow);
  const doneCount = reminders.filter(reminderDone).length;
  const who = state.turn === "mine" ? "Your" : "Opponent's";
  const title = state.phase === "end"
    ? `End of <span class="who">${state.turn === "mine" ? "your" : "your opponent's"}</span> turn`
    : `<span class="who">${who}</span> ${phaseLabel(state.phase)} phase`;
  const available = strats.filter(s => !stratStatus(s) && state.cp >= s.cp).length;
  const nCore = strats.filter(s => s.type === "Core").length;

  const checks = reminders.length ? `<ul class="checks">${reminders.map(r => {
    const on = reminderDone(r);
    const usedNote = on && r.limit === "battle" ? `<span class="tag used">Used</span>` : "";
    const cid = `chk-${r.id}`;
    return `<li class="check ${on ? "is-done" : ""}">
      <input type="checkbox" id="${cid}" data-check="${r.id}" data-limit="${r.limit || ""}" ${on ? "checked" : ""}>
      <label for="${cid}">
        <span class="src">${esc(r.src)}${r.name ? " · " + esc(r.name) : ""} ${limitTag(r.limit)}${usedNote}${verifyTag(r)}</span>
        <span class="txt">${fmt(dyn(r.text))}</span>
      </label></li>`;
  }).join("")}</ul>` : `<p class="empty">Nothing to do in this step.</p>`;

  const augmentations = dets.some(d => d.id === "bile")
    ? (state.aug.length
        ? state.aug.map(id => AUGMENTATIONS.find(a => a.id === id)).filter(Boolean).map(a => ({ src: "Creations of Bile · Augmentation", name: a.name, text: `${a.text} For your HERETIC ASTARTES INFANTRY (not DAMNED).` }))
        : [{ src: "Creations of Bile", name: "Experimental Augmentations", text: "None picked yet: choose them on the Army tab." }])
    : [];
  const passive = [
    ...dets.map(d => ({ src: `Detachment rule · ${d.name}`, name: d.rule.name, text: d.rule.text })),
    ...augmentations,
    ...armyNotes().map(text => ({ src: "Army", name: "Note", text })),
    ...dets.flatMap(d => d.enh).filter(e => state.enh.includes(e.id) && !e.slots).map(e => ({ src: "Enhancement", name: e.name, text: e.text })),
    ...selUnits().flatMap(u => u.abilities.filter(a => !a.slots).map(a => ({ src: `Unit · ${u.short || u.name}`, name: a.name, text: a.text })))
  ];

  const log = state.log.slice(0, 8);
  return `
  <section class="ctx">
    <h1>${title}</h1>
    <p class="sub">Battle round ${state.round} · ${esc(detLabel())} · ${available} stratagem${available === 1 ? "" : "s"} usable now</p>
    ${armyProblems().map(p => `<p class="overline">${esc(p.text)} Fix it on the Army tab.</p>`).join("")}
  </section>

  <section class="block" aria-labelledby="h-check">
    <h2 id="h-check">Checklist <span class="count">${doneCount}/${reminders.length} done</span></h2>
    ${checks}
  </section>

  <section class="block" aria-labelledby="h-strats">
    <h2 id="h-strats">Stratagems now <span class="count">${strats.length - nCore} detachment · ${nCore} core</span></h2>
    <p class="rules-note">Each Stratagem once per phase. A unit can be targeted by only one Stratagem per phase. Battle-shocked units can't be targeted.</p>
    ${strats.length ? groupedCards(strats, { interactive: true }) : `<p class="empty">No stratagems for this step.</p>`}
  </section>

  <section class="block" aria-labelledby="h-always">
    <h2 id="h-always">Always on</h2>
    <ul class="always">${passive.length ? passive.map(p => `<li><span class="src">${esc(p.src)}</span><span class="nm">${esc(p.name)}</span><span>${fmt(dyn(p.text))}</span></li>`).join("") : `<li><span>No detachment picked. Choose one or more on the Army tab.</span></li>`}</ul>
  </section>

  <section class="block" aria-labelledby="h-log">
    <div class="log-head"><h2 id="h-log">Game log</h2>
      <button class="ghost" data-act="undo" ${undoStack.length ? "" : "disabled"}>Undo last change</button></div>
    <ul class="log">${log.map(l => `<li><span class="at">${esc(l.at)}</span><span>${esc(l.text)}</span></li>`).join("")}</ul>
  </section>`;
}

const SHORT_WIN = { start: "Start of phase", during: "", react: "Reaction", end: "End of phase" };

function renderOverview() {
  const dets = selDets();
  const pool = stratPool();
  const rows = [{ id: "any", label: "Any phase" }].concat(PHASES.filter(p => p.id !== "end"));
  const cols = [{ id: "mine", label: "Your turn" }, { id: "opp", label: "Opponent's turn" }];
  const inCell = (s, t, p) => s.slots.some(sl => { const [st, sp] = sl.split(":"); return (st === "any" || st === t) && sp === p; });
  const legend = dets.map((d, i) => `<span class="lg"><span class="sw src-${i + 1}"></span>${esc(d.name)} · ${d.strats.length}</span>`).join("")
    + `<span class="lg"><span class="sw src-core"></span>Core · ${CORE.length}</span>`;
  const item = s => {
    const extra = [SHORT_WIN[s.w], s.limit ? { battle: "once per battle", turn: "once per turn", round: "once per round" }[s.limit] : ""].filter(Boolean).join(" · ");
    return `<button class="ov-item ${srcClass(s)}" data-act="sheet" data-id="${s.id}" aria-haspopup="dialog">
      <span class="cpb">${s.cp}CP</span><span class="nm">${esc(s.name)}</span>${extra ? `<span class="wl">${esc(extra)}</span>` : ""}</button>`;
  };
  const body = rows.map(r => {
    const cells = cols.map(c => ({ c, list: pool.filter(s => inCell(s, c.id, r.id)).sort(byWindow) }));
    const total = new Set(cells.flatMap(x => x.list.map(s => s.id))).size;
    return `<section class="ov-phase" aria-label="${esc(r.label)}">
      <h2>${esc(r.label)}${r.id === "any" ? "" : " phase"} <span class="count">${total}</span></h2>
      <div class="ov-row">${cells.map(({ c, list }) => {
        const now = state.turn === c.id && (state.phase === r.id || (r.id === "any" && state.phase !== "end"));
        return `<div class="ov-cell ${now && r.id !== "any" ? "now" : ""}">
          <div class="ov-cap"><span>${c.label}</span>${now && r.id !== "any" ? `<span class="nowtag">Now</span>` : ""}</div>
          ${list.length ? list.map(item).join("") : `<div class="ov-none">None</div>`}
        </div>`;
      }).join("")}</div>
    </section>`;
  }).join("");
  return `<div class="legend" aria-label="Colour per source">${legend}</div><div class="ov">${body}</div>`;
}

function renderSheet() {
  const s = sheetId && ALL_STRATS[sheetId];
  if (!s) return "";
  return `<div class="sheet-back" data-act="sheet-close">
    <div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(s.name)}">
      <div class="sheet-head"><span class="meta">${s.slots.map(slotChip).map(esc).join(" · ")}</span>
        <button class="ghost" id="sheet-close" data-act="sheet-close">Close</button></div>
      ${stratCard(s, { interactive: false, showSlots: false })}
    </div></div>`;
}

function renderStrats() {
  const mode = state.stratMode === "cards" ? "cards" : "overview";
  const dets = selDets();
  const head = `
  <section class="ctx">
    <h1>All stratagems</h1>
    <p class="sub">${dets.length ? esc(detLabel()) + " and the core stratagems." : "Core stratagems only: pick detachments on the Army tab."} ${mode === "overview" ? "Tap one to read it." : ""}</p>
  </section>
  <div class="seg neutral" role="group" aria-label="Layout">
    <button data-act="smode" data-mode="overview" aria-pressed="${mode === "overview"}">Overview</button>
    <button data-act="smode" data-mode="cards" aria-pressed="${mode === "cards"}">Full cards</button>
  </div>`;
  return head + (mode === "overview" ? renderOverview() : renderStratCards());
}

function renderStratCards() {
  const order = s => {
    const [t, p] = s.slots[0].split(":");
    const pi = p === "any" ? -1 : PHASES.findIndex(x => x.id === p);
    return pi * 10 + (t === "mine" ? 0 : t === "any" ? 1 : 2) + WIN[s.w].o / 10;
  };
  const dets = selDets();
  const sections = dets.map(d => ({ title: d.name, sub: `${d.dp} DP · Detachment rule: ${d.rule.name}`, list: d.strats }))
    .concat([{ title: "Core stratagems", sub: "Available to every army. Explosives needs an EXPLOSIVES or GRENADES unit and Smokescreen a SMOKE unit.", list: CORE }]);
  const jump = sections.map((sec, i) => `<button class="tag jump" data-act="jump" data-to="sec-${i}">${esc(sec.title)}</button>`).join("");
  return `
  <p class="slots">${jump}</p>
  ${sections.map((sec, i) => `<section class="block" id="sec-${i}">
    <h2>${esc(sec.title)} <span class="count">${sec.list.length}</span></h2>
    <p class="hint">${esc(sec.sub)}</p>
    <div class="cards">${sec.list.slice().sort((a, b) => order(a) - order(b)).map(s => stratCard(s, { interactive: false, showSlots: true })).join("")}</div>
  </section>`).join("")}`;
}

function slotText(c) {
  const [t, p] = c.slots[0].split(":");
  const tt = { mine: "Your turn", opp: "Opponent's turn", any: "Either turn" }[t];
  const pp = p === "any" ? "any phase" : phaseLabel(p);
  return `${tt} · ${pp} · ${WIN[c.w].label.toLowerCase()}${c.limit ? " · once per battle" : ""}`;
}

function renderArmy() {
  const dets = selDets(), used = dpUsed(), budget = state.settings.dp, size = currentSize();
  const problems = armyProblems(), dpProblems = problems.filter(p => p.kind !== "enh"), enhProblems = problems.filter(p => p.kind === "enh");
  const over = used > budget && !isLoneIncursionDetachment(dets);
  const pips = Array.from({ length: Math.max(budget, used) }, (_, i) => `<span class="${i < Math.min(used, budget) ? "on" : i >= budget ? "over" : ""}"></span>`).join("");
  const cultNote = darkPactsLost()
    ? "Renegade Warband is selected, so you can't use Cults of the Dark Gods."
    : `Cults of the Dark Gods: you can add KHORNE BERZERKERS, RUBRIC MARINES, PLAGUE MARINES and NOISE MARINES to your army (their faction keyword becomes HERETIC ASTARTES), up to ${size.cult} pts of them in total at this battle size. Plague Marines' Infused with the Blessings of Nurgle has no effect.`;
  return `
  <section class="ctx">
    <h1>Your army</h1>
    <p class="sub">Pick your detachments and what's in your list. The checklist only shows what applies.</p>
  </section>

  <section class="block" aria-labelledby="h-size">
    <h2 id="h-size">Battle size</h2>
    <div class="seg neutral" role="group" aria-label="Battle size">${SIZES.map(z => `<button data-act="size" data-size="${z.id}" aria-pressed="${state.settings.size === z.id}">${z.label}</button>`).join("")}</div>
    <div class="setting">
      <span>Detachment Points to spend<br><span class="sm">${state.settings.size === "onslaught" ? "The core rules only list Incursion and Strike Force: set the Onslaught budget to match your mission pack." : "Incursion 2 DP · Strike Force 3 DP"}</span></span>
      <div class="stepper cp" role="group" aria-label="Detachment Points budget">
        <button data-act="dp" data-d="-1" aria-label="Lower DP budget">−</button>
        <output class="num">${budget}</output>
        <button data-act="dp" data-d="1" aria-label="Raise DP budget">+</button>
      </div>
    </div>
    <p class="rules-note">${fmt(cultNote)}</p>
  </section>

  <section class="block" aria-labelledby="h-det">
    <h2 id="h-det">Detachments <span class="count">${used}/${budget} DP used</span></h2>
    <div class="pips" aria-hidden="true">${pips}</div>
    ${over ? `<p class="overline">Over budget by ${used - budget} DP. Remove a detachment or raise the DP budget.</p>` : ""}
    ${dpProblems.filter(p => p.kind === "unique").map(p => `<p class="overline">${esc(p.text)} Remove one of them.</p>`).join("")}
    ${armyNotes().map(t => `<p class="rules-note">${esc(t)}</p>`).join("")}
    <p class="hint">Combine detachments up to your DP budget. You can't take the same one twice, or two that share a Unique tag. In an Incursion battle a 3 DP detachment can be your only detachment. You get all of their rules, enhancements and stratagems.</p>
    <div class="opts">${DETACHMENTS.map(d => {
      const on = state.dets.includes(d.id), why = blockReason(d);
      return `
      <label class="opt ${on ? "on" : ""} ${why ? "off" : ""}" for="det-${d.id}">
        <input type="checkbox" id="det-${d.id}" data-det="${d.id}" ${on ? "checked" : ""} ${why ? "disabled" : ""}>
        <span><span class="nm">${esc(d.name)}</span><span class="dp">${d.dp} DP</span>${d.unique ? `<span class="tag">Unique: ${esc(d.unique)}</span>` : ""}
        <br><span class="sm">${esc(d.rule.name)}: ${fmt(dyn(d.rule.text))}</span>
        <span class="fd">${d.fd.map(f => `<span class="tag">${esc(f)}</span>`).join("")}</span>
        ${why ? `<span class="why">${esc(why)}</span>` : ""}</span>
      </label>`;
    }).join("")}</div>
  </section>

  <section class="block" aria-labelledby="h-enh">
    <h2 id="h-enh">Enhancements in your list <span class="count">${state.enh.length}${size.enh != null ? `/${size.enh}` : ""} picked</span></h2>
    ${enhProblems.map(p => `<p class="overline">${esc(p.text)} Untick one.</p>`).join("")}
    <p class="hint">Each unit can have only one enhancement. The limit is 2 in Incursion and 4 in Strike Force${size.enh == null ? "; none is published for Onslaught" : ""}.</p>
    ${dets.length ? dets.map(d => `
      <h3 class="win">${esc(d.name)}</h3>
      <div class="opts">${d.enh.map(e => `
        <label class="opt ${state.enh.includes(e.id) ? "on" : ""}" for="enh-${e.id}">
          <input type="checkbox" id="enh-${e.id}" data-enh="${e.id}" ${state.enh.includes(e.id) ? "checked" : ""}>
          <span><span class="nm">${esc(e.name)}</span> ${limitTag(e.limit)}${verifyTag(e)}<br><span class="sm">${fmt(e.who)}. ${fmt(e.text)}</span></span>
        </label>`).join("")}</div>`).join("") : `<p class="empty">Pick a detachment first.</p>`}
  </section>

  ${dets.some(d => d.id === "bile") ? `
  <section class="block" aria-labelledby="h-aug">
    <h2 id="h-aug">Experimental Augmentations <span class="count">${state.aug.length}/2 picked</span></h2>
    <p class="hint">Creations of Bile: at the start of the battle pick one, or roll two D6 for two (re-roll one or both dice if FABIUS BILE is your WARLORD). They apply to your HERETIC ASTARTES INFANTRY (not DAMNED) until the end of the battle.</p>
    <div class="opts">${AUGMENTATIONS.map(a => `
      <label class="opt ${state.aug.includes(a.id) ? "on" : ""}" for="${a.id}">
        <input type="checkbox" id="${a.id}" data-aug="${a.id}" ${state.aug.includes(a.id) ? "checked" : ""}>
        <span><span class="nm">${esc(a.name)}</span><span class="dp">D6 ${a.roll}</span><br><span class="sm">${fmt(a.text)}</span></span>
      </label>`).join("")}</div>
  </section>` : ""}

  <section class="block" aria-labelledby="h-units">
    <h2 id="h-units">Units with timed abilities</h2>
    <p class="hint">Tick the ones in your list and their abilities appear in the right phase. Dark Pact effects, Chaos Icons and detachment bonuses show up in the Shooting and Fight phases.</p>
    <div class="opts">${UNITS.map(u => `
      <label class="opt ${state.units.includes(u.id) ? "on" : ""}" for="unit-${u.id}">
        <input type="checkbox" id="unit-${u.id}" data-unit="${u.id}" ${state.units.includes(u.id) ? "checked" : ""}>
        <span><span class="nm">${esc(u.name)}</span>${u.abilities.map(a => `<br><span class="sm"><b>${esc(a.name)}</b> ${limitTag(a.limit)} ${fmt(a.text)}</span>`).join("")}</span>
      </label>`).join("")}</div>
  </section>

  <section class="block" aria-labelledby="h-custom">
    <h2 id="h-custom">Your own reminders <span class="count">${state.custom.length}</span></h2>
    <p class="hint">For anything else in your list, such as other unit abilities or a plan for a specific turn.</p>
    <form class="custom-form" id="custom-form" autocomplete="off">
      <label class="f" for="c-text">Reminder</label>
      <input type="text" id="c-text" maxlength="160" required placeholder="e.g. Bring the Terminators in from Reserves">
      <div class="f-row">
        <div><label class="f" for="c-turn">Turn</label>
          <select id="c-turn"><option value="mine">My turn</option><option value="opp">Opponent's turn</option><option value="any">Either turn</option></select></div>
        <div><label class="f" for="c-phase">Phase</label>
          <select id="c-phase">${PHASES.map(p => `<option value="${p.id}">${p.label}</option>`).join("")}<option value="any">Any phase</option></select></div>
        <div><label class="f" for="c-win">When</label>
          <select id="c-win">${Object.keys(WIN).map(w => `<option value="${w}" ${w === "during" ? "selected" : ""}>${WIN[w].label}</option>`).join("")}</select></div>
      </div>
      <label class="chk" for="c-once"><input type="checkbox" id="c-once"> Once per battle</label>
      <button type="submit" class="primary">Add reminder</button>
    </form>
    ${state.custom.length ? `<ul class="custom-list">${state.custom.map(c => `
      <li><span>${esc(c.text)}<br><span class="sm">${esc(slotText(c))}</span></span>
      <button class="ghost" data-act="del-custom" data-id="${c.id}" aria-label="Delete reminder">Delete</button></li>`).join("")}</ul>` : ""}
  </section>

  <section class="block" aria-labelledby="h-settings">
    <h2 id="h-settings">Game</h2>
    <div class="setting"><span>Who takes the first turn</span>
      <div class="seg neutral" role="group" aria-label="First turn">
        <button data-act="first" data-turn="mine" aria-pressed="${state.settings.first === "mine"}">Me</button>
        <button data-act="first" data-turn="opp" aria-pressed="${state.settings.first === "opp"}">Opponent</button>
      </div></div>
    <label class="setting" for="autocp"><span>Add 1CP automatically in each Command phase</span>
      <input type="checkbox" id="autocp" ${state.settings.autoCP ? "checked" : ""} style="width:20px;height:20px;accent-color:var(--mine)"></label>
    <button class="danger" data-act="newgame" id="newgame">Start a new game</button>
  </section>

  <section class="about">
    <p>Rules are summarised in my own words from <a href="${WAHA}" target="_blank" rel="noopener">Wahapedia's Chaos Space Marines page</a> (11th edition, Chaos Space Marines rules v1.2, including Detachment Point costs), its rules data export and the 11th-edition core rules, and checked against them on 18 November 2026. Rules change with updates, so check the full wording if something looks off. A "Check wording" tag marks any entry whose timing or wording differs between sources.</p>
    <p>Legends datasheets aren't included. Khorne Berzerkers and Noise Marines (Cults of the Dark Gods) are.</p>
    <p>Unofficial tool for personal use. Warhammer 40,000 and its rules belong to Games Workshop. Powered by Wahapedia.</p>
    <p>Your game is saved in this browser only.</p>
  </section>`;
}

function renderTabs() {
  const tabs = [["game", "Game"], ["strats", "Stratagems"], ["army", "Army"]];
  return tabs.map(([id, label]) => `<button data-act="view" data-view="${id}" ${state.view === id ? 'aria-current="page"' : ""}>${label}</button>`).join("");
}

function render() {
  const focusId = document.activeElement && document.activeElement.id;
  document.body.dataset.turn = state.turn;
  document.getElementById("tracker").innerHTML = renderTracker();
  const main = document.getElementById("main");
  main.innerHTML = state.view === "army" ? renderArmy() : state.view === "strats" ? renderStrats() : renderGame();
  document.getElementById("tabbar").innerHTML = renderTabs();
  if (state.view !== "strats") sheetId = null;
  document.getElementById("sheet-root").innerHTML = renderSheet();
  document.body.style.overflow = sheetId ? "hidden" : "";
  const list = document.querySelector(".phase-list"), cur = list && list.querySelector('[aria-current="step"]');
  if (cur) list.scrollLeft = Math.max(0, cur.offsetLeft - list.offsetLeft - (list.clientWidth - cur.offsetWidth) / 2);
  if (focusId) { const el = document.getElementById(focusId); if (el) el.focus({ preventScroll: true }); }
}

/* ---------------- events ---------------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const act = b.dataset.act;
  switch (act) {
    case "view": state.view = b.dataset.view; save(); render(); window.scrollTo(0, 0); break;
    case "round": mutate(() => { state.round = Math.min(5, Math.max(1, state.round + Number(b.dataset.d))); }); break;
    case "turn": if (state.turn !== b.dataset.turn) mutate(() => { state.turn = b.dataset.turn; }); break;
    case "cp": mutate(() => { state.cp = Math.max(0, state.cp + Number(b.dataset.d)); }); break;
    case "phase": if (state.phase !== b.dataset.phase) mutate(() => { state.phase = b.dataset.phase; if (state.view !== "game") state.view = "game"; }); else if (state.view !== "game") { state.view = "game"; save(); render(); } break;
    case "next": mutate(() => { nextPhase(); state.view = "game"; }); break;
    case "use": mutate(() => useStrat(b.dataset.id)); break;
    case "undo": undo(); break;
    case "size": mutate(() => {
      const z = SIZES.find(x => x.id === b.dataset.size);
      state.settings.size = z.id; if (z.dp) state.settings.dp = z.dp;
    }); break;
    case "smode": state.stratMode = b.dataset.mode; save(); render(); break;
    case "sheet": sheetId = b.dataset.id; render(); { const c = document.getElementById("sheet-close"); if (c) c.focus(); } break;
    case "sheet-close": if (e.target === b || b.id === "sheet-close") { const back = sheetId; sheetId = null; render(); const o = document.querySelector(`[data-act="sheet"][data-id="${back}"]`); if (o) o.focus({ preventScroll: true }); } break;
    case "jump": { const el = document.getElementById(b.dataset.to); if (el) el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }); break; }
    case "dp": mutate(() => { state.settings.dp = Math.min(9, Math.max(1, state.settings.dp + Number(b.dataset.d))); }); break;
    case "first": mutate(() => { state.settings.first = b.dataset.turn; }); break;
    case "del-custom": mutate(() => { state.custom = state.custom.filter(c => c.id !== b.dataset.id); }); break;
    case "newgame":
      if (b.classList.contains("armed")) {
        mutate(() => { state = freshGame(state); state.view = "game"; });
        toast("New game: round 1, Command phase, 1CP");
        window.scrollTo(0, 0);
      } else {
        b.classList.add("armed"); b.textContent = "Tap again to reset the game";
        setTimeout(() => { const n = document.getElementById("newgame"); if (n) { n.classList.remove("armed"); n.textContent = "Start a new game"; } }, 3500);
      }
      break;
  }
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && sheetId) { const back = sheetId; sheetId = null; render(); const o = document.querySelector(`[data-act="sheet"][data-id="${back}"]`); if (o) o.focus({ preventScroll: true }); }
});

document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.check) mutate(() => toggleReminder(t.dataset.check, t.dataset.limit, t.checked));
  else if (t.dataset.det) {
    const d = DET[t.dataset.det];
    if (t.checked) {
      const why = blockReason(d);
      if (why) { t.checked = false; toast(why); return; }
      mutate(() => { state.dets = state.dets.concat(d.id); });
      toast(`${d.name} added · ${dpUsed()}/${state.settings.dp} DP`);
    } else {
      const ids = d.enh.map(x => x.id);
      mutate(() => {
        state.dets = state.dets.filter(x => x !== d.id);
        state.enh = state.enh.filter(x => !ids.includes(x));
        if (d.id === "bile") state.aug = [];
      });
      toast(`${d.name} removed · ${dpUsed()}/${state.settings.dp} DP`);
    }
  }
  else if (t.dataset.enh) mutate(() => { state.enh = t.checked ? state.enh.concat(t.dataset.enh) : state.enh.filter(x => x !== t.dataset.enh); });
  else if (t.dataset.aug) {
    if (t.checked && state.aug.length >= 2) { t.checked = false; toast("Only two augmentations at the start of the battle"); return; }
    mutate(() => { state.aug = t.checked ? state.aug.concat(t.dataset.aug) : state.aug.filter(x => x !== t.dataset.aug); });
  }
  else if (t.dataset.unit) mutate(() => { state.units = t.checked ? state.units.concat(t.dataset.unit) : state.units.filter(x => x !== t.dataset.unit); });
  else if (t.id === "autocp") mutate(() => { state.settings.autoCP = t.checked; });
});

document.addEventListener("submit", e => {
  if (e.target.id !== "custom-form") return;
  e.preventDefault();
  const text = document.getElementById("c-text").value.trim();
  if (!text) return;
  const turn = document.getElementById("c-turn").value;
  const phase = document.getElementById("c-phase").value;
  const w = document.getElementById("c-win").value;
  const once = document.getElementById("c-once").checked;
  mutate(() => {
    state.custom.push({ id: "c" + Date.now().toString(36), name: "", text, slots: [`${turn}:${phase}`], w, limit: once ? "battle" : null });
  });
  toast("Reminder added");
});

render();
</script>
</body>
</html>
